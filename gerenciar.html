<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área Administrativa — Encanto Nail Designer</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            min-height: 100vh;
            background: linear-gradient(180deg, #fff0f8 0%, #ffe6f2 100%);
            background-image: 
                radial-gradient(#ffb3d9 1px, transparent 1px),
                radial-gradient(#ffb3d9 1px, transparent 1px);
            background-size: 25px 25px;
            background-position: 0 0, 12.5px 12.5px;
            font-family: 'Segoe UI', sans-serif;
            padding: 1rem;
        }

        .caixa-principal {
            max-width: 760px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 28px;
            border: 4px solid #ff99cc;
            padding: 2.5rem;
            box-shadow: 0 10px 30px rgba(255, 102, 178, 0.2);
            position: relative;
        }

        h1 {
            text-align: center;
            color: #ff66b2;
            font-size: 2.2rem;
            font-family: Georgia, serif;
            font-style: italic;
            margin-bottom: 0.5rem;
        }

        .subtitulo {
            text-align: center;
            color: #b34782;
            font-size: 1.1rem;
            margin-bottom: 2rem;
        }

        .escondido { display: none !important; }

        .grupo-senha {
            position: relative;
            margin-bottom: 1.5rem;
        }

        input, textarea {
            width: 100%;
            padding: 1rem 1.2rem;
            padding-right: 3.5rem;
            border: 2px solid #ffd9e6;
            border-radius: 16px;
            font-size: 1rem;
            outline: none;
            background: #fffafc;
        }

        input:focus, textarea:focus {
            border-color: #ff66b2;
            box-shadow: 0 0 0 4px rgba(255, 102, 178, 0.15);
        }

        .botao-olho {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
        }

        button {
            padding: 1rem 1.5rem;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:active { transform: scale(0.98); }

        .btn-principal {
            background: linear-gradient(90deg, #ff66b2, #ff80c0);
            color: white;
            width: 100%;
            font-size: 1.1rem;
        }

        .btn-sair {
            background: linear-gradient(90deg, #e53935, #f4511e);
            color: white;
            padding: 0.7rem 1.3rem;
            font-size: 0.9rem;
        }

        .btn-verde { background: linear-gradient(90deg, #25D366, #128C7E); color: white; }
        .btn-vermelho { background: linear-gradient(90deg, #ef5350, #e53935); color: white; }
        .btn-azul { background: linear-gradient(90deg, #2196F3, #1976D2); color: white; }

        .aviso-erro {
            color: #d32f2f;
            background: #ffebee;
            padding: 0.8rem 1rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            border-left: 4px solid #ef5350;
        }

        .linha-cabecalho {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px dashed #ffd9e6;
        }

        .bloco-pessoa {
            background: #faf0f5;
            border-radius: 20px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border-left: 5px solid #ff66b2;
        }

        .pessoa-nome {
            font-weight: bold;
            font-size: 1.4rem;
            color: #993366;
            margin-bottom: 0.5rem;
        }

        .btn-apagar-pessoa {
            margin-bottom: 1rem;
            padding: 0.6rem 1.5rem;
            font-size: 0.9rem;
        }

        .pessoa-dados {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
            font-size: 0.85rem;
        }

        .etiqueta {
            padding: 0.3rem 0.8rem;
            border-radius: 50px;
            font-weight: 600;
        }

        .etq-id { background: #e3f2fd; color: #1565c0; }
        .etq-acessos { background: #fff3cd; color: #856404; }
        .etq-data { background: #f3e5f5; color: #7b1fa2; }

        .mensagem-card {
            border-radius: 16px;
            padding: 1.2rem;
            margin-bottom: 0.8rem;
            border: 2px solid #eee;
            background: #fff;
        }

        .pendente { background: #fff9e6; border-color: #ffc107; }
        .respondida { background: #e8f5e9; border-color: #66bb6a; }

        .etiqueta-status {
            padding: 0.3rem 0.8rem;
            border-radius: 50px;
            font-weight: bold;
            font-size: 0.8rem;
            margin-left: 0.5rem;
        }

        .status-pendente { background: #fff3cd; color: #856404; }
        .status-respondido { background: #c8e6c9; color: #2e7d32; }

        .resposta-caixa {
            background: #fff;
            border-radius: 12px;
            padding: 1rem;
            margin-top: 0.8rem;
            border-left: 4px solid #25D366;
        }

        .botoes-acao {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
            margin-top: 0.8rem;
        }

        .botoes-acao button { flex: 1; min-width: 110px; padding: 0.7rem; font-size: 0.9rem; }

        .modal-fundo {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            z-index: 999;
        }

        .modal {
            background: #fff;
            border-radius: 24px;
            padding: 2rem;
            max-width: 420px;
            width: 100%;
            border: 4px solid #ff99cc;
        }

        .modal h3 {
            color: #ff66b2;
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .vazio {
            text-align: center;
            padding: 3rem 1rem;
            color: #b34782;
        }

        .voltar {
            text-align: center;
            margin-top: 2rem;
        }

        .voltar a {
            color: #b34782;
            text-decoration: none;
        }

        @media (max-width: 480px) {
            .caixa-principal { padding: 1.5rem; }
            .linha-cabecalho { flex-direction: column; gap: 1rem; text-align: center; }
        }
    </style>
</head>
<body>

    <div id="telaLogin" class="caixa-principal">
        <h1>🔐 Área Administrativa</h1>
        <p class="subtitulo">♥ Encanto Nail Designer ♥</p>

        <div class="grupo-senha">
            <input type="password" id="campoSenha" placeholder="Digite a senha..." autocomplete="off">
            <button type="button" class="botao-olho" onclick="alternarVisibilidade()">🙈</button>
        </div>

        <p id="avisoErro" class="aviso-erro escondido">❌ Senha incorreta!</p>

        <button class="btn-principal" onclick="verificarSenha()">🔐 Entrar</button>

        <div class="voltar">
            <a href="index.html">← Voltar para o site</a>
        </div>
    </div>

    <div id="painelControle" class="caixa-principal escondido">
        <div class="linha-cabecalho">
            <div>
                <h1>💬 Mensagens & Acessos</h1>
                <p class="subtitulo" style="margin:0;">Bem-vinda, Mylena ♥</p>
            </div>
            <button class="btn-sair" onclick="sair()">🚪 Sair</button>
        </div>

        <p style="color:#993366; font-size:0.9rem; margin-bottom:1.5rem;">
            🆔 ID = identificador único | 👁️ = quantidade de visitas
        </p>

        <div id="lista-conteudo"></div>

        <div class="botoes-acao" style="margin-top:2rem;">
            <button class="btn-vermelho" onclick="if(confirm('⚠️ APAGAR TODAS AS MENSAGENS? As visitas serão mantidas!')) limparSomenteMensagens()">🗑️ Limpar Mensagens</button>
        </div>

        <div class="voltar">
            <a href="index.html">← Voltar para o site</a>
        </div>
    </div>

    <div id="modalResposta" class="modal-fundo escondido">
        <div class="modal">
            <h3>✍️ Responder</h3>
            <p style="margin-bottom:0.5rem;">
                <strong>De:</strong> <span id="m-nome"></span>
                <span class="etiqueta etq-id" id="m-id"></span>
            </p>
            <textarea id="m-resposta" rows="4" placeholder="Sua resposta..."></textarea>
            <input type="hidden" id="m-chave">
            <div class="botoes-acao">
                <button class="btn-verde" onclick="enviarResposta()">✅ Enviar</button>
                <button class="btn-vermelho" onclick="fecharModal()">✖️ Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        const SENHA_ADMIN = "WJ321";
        const CAMINHO_MSG = "encanto_nail_designer/mensagens";
        const CAMINHO_ACESSOS = "encanto_nail_designer/acessos";

        const firebaseConfig = {
            apiKey: "AIzaSyCqsOq01FhDq9z9Wn0tK9XbP8mIeQ9z7yM",
            authDomain: "willobras.firebaseapp.com",
            databaseURL: "https://willobras-default-rtdb.firebaseio.com",
            projectId: "willobras",
            storageBucket: "willobras.firebasestorage.app",
            messagingSenderId: "66370500400",
            appId: "1:66370500400:web:42d6569ca2c8172ddf3af5"
        };

        let db = null;
        if (typeof firebase !== 'undefined' && !firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
        }

        function dataAtual() {
            return new Date().toLocaleString('pt-BR');
        }

        let senhaVisivel = false;

        function alternarVisibilidade() {
            const campo = document.getElementById('campoSenha');
            const botao = document.querySelector('.botao-olho');
            senhaVisivel = !senhaVisivel;
            campo.type = senhaVisivel ? 'text' : 'password';
            botao.textContent = senhaVisivel ? '👁️' : '🙈';
        }

        function verificarSenha() {
            const digitada = document.getElementById('campoSenha').value.trim();
            if (digitada === SENHA_ADMIN) {
                document.getElementById('telaLogin').classList.add('escondido');
                document.getElementById('painelControle').classList.remove('escondido');
                carregarTudo();
            } else {
                document.getElementById('avisoErro').classList.remove('escondido');
                document.getElementById('campoSenha').value = '';
            }
        }

        function sair() {
            if (!confirm("Sair da área administrativa?")) return;
            document.getElementById('painelControle').classList.add('escondido');
            document.getElementById('telaLogin').classList.remove('escondido');
            document.getElementById('avisoErro').classList.add('escondido');
            document.getElementById('campoSenha').value = '';
            senhaVisivel = false;
        }

        async function carregarTudo() {
            if (!db) {
                document.getElementById('lista-conteudo').innerHTML = 
                    '<div class="vazio"><p>⚠️ Firebase não carregou. Atualize a página.</p></div>';
                return;
            }

            const snapAcessos = await db.ref(CAMINHO_ACESSOS).once("value");
            const snapMensagens = await db.ref(CAMINHO_MSG).once("value");

            const acessos = snapAcessos.val() || {};
            const mensagens = snapMensagens.val() || {};
            const container = document.getElementById('lista-conteudo');
            container.innerHTML = '';

            if (!snapAcessos.exists() && !snapMensagens.exists()) {
                container.innerHTML = '<div class="vazio"><p>📭 Nenhuma pessoa visitou ainda</p></div>';
                return;
            }

            const porId = {};
            for (const chave in mensagens) {
                const m = mensagens[chave];
                if (!m.idRemetente) continue;
                if (!porId[m.idRemetente]) porId[m.idRemetente] = [];
                porId[m.idRemetente].push({ chave, ...m });
            }

            for (const idPessoa in acessos) {
                const p = acessos[idPessoa];
                const nomeExibir = p.nome || "Visitante (sem nome)";
                const msgs = porId[idPessoa] || [];

                container.innerHTML += `
                    <div class="bloco-pessoa">
                        <div class="pessoa-nome">${nomeExibir}</div>
                        <button class="btn-vermelho btn-apagar-pessoa" onclick="excluirSomenteAcessos('${idPessoa}')">
                            🗑️ Apagar Visualizações
                        </button>
                        <div class="pessoa-dados">
                            <span class="etiqueta etq-id">🆔 ${p.id}</span>
                            <span class="etiqueta etq-acessos">👁️ ${p.acessos || 0} visitas</span>
                            <span class="etiqueta etq-data">📅 1ª visita: ${p.primeiroAcesso || '—'}</span>
                            <span class="etiqueta etq-data">🕘 Última visita: ${p.ultimoAcesso || '—'}</span>
                        </div>
                        ${msgs.length === 0 ? '<p style="color:#999; font-size:0.9rem;">Sem mensagens</p>' : ''}
                        ${msgs.map(m => {
                            const resp = (m.resposta || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
                            return `
                            <div class="mensagem-card ${m.resposta ? 'respondida' : 'pendente'}">
                                <p style="margin-bottom:0.5rem;">${m.texto}</p>
                                <span style="font-size:0.8rem; color:#888;">${m.data || ''}</span>
                                <span class="etiqueta-status ${m.resposta ? 'status-respondido' : 'status-pendente'}">
                                    ${m.resposta ? '✅ Respondida' : '⏳ Pendente'}
                                </span>
                                ${m.resposta ? `
                                    <div class="resposta-caixa">
                                        <p style="font-weight:bold; color:#2e7d32;">📩 Resposta:</p>
                                        <p>${m.resposta}</p>
                                        <span style="font-size:0.8rem; color:#888;">${m.dataResposta || ''}</span>
                                    </div>
                                ` : ''}
                                <div class="botoes-acao">
                                    <button class="btn-verde" onclick='abrirModal("${m.chave}", "${nomeExibir.replace(/"/g, '&quot;')}", "${idPessoa}", "${resp}")'>
                                        ${m.resposta ? '✏️ Editar' : '✍️ Responder'}
                                    </button>
                                    <button class="btn-vermelho" onclick="excluirMensagem('${m.chave}')">🗑️ Mensagem</button>
                                </div>
                            </div>
                        `}).join('')}
                    </div>
                `;
            }

            for (const id in porId) {
                if (acessos[id]) continue;
                const msgs = porId[id];
                const nomeMsg = (msgs[0].nomeRemetente || "Visitante").replace(/"/g, '&quot;');
                container.innerHTML += `
                    <div class="bloco-pessoa" style="opacity:0.8;">
                        <div class="pessoa-nome">${nomeMsg}</div>
                        <div class="pessoa-dados">
                            <span class="etiqueta etq-id">🆔 ${id}</span>
                            <span class="etiqueta etq-acessos">👁️ Sem registro de visualizações</span>
                        </div>
                        ${msgs.map(m => {
                            const resp = (m.resposta || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
                            return `
                            <div class="mensagem-card ${m.resposta ? 'respondida' : 'pendente'}">
                                <p>${m.texto}</p>
                                <span style="font-size:0.8rem; color:#888;">${m.data || ''}</span>
                                <div class="botoes-acao">
                                    <button class="btn-verde" onclick='abrirModal("${m.chave}", "${nomeMsg}", "${id}", "${resp}")'>Responder</button>
                                    <button class="btn-vermelho" onclick="excluirMensagem('${m.chave}')">🗑️ Mensagem</button>
                                </div>
                            </div>
                        `}).join('')}
                    </div>
                `;
            }
        }

        function abrirModal(chave, nome, id, resposta) {
            document.getElementById('m-chave').value = chave;
            document.getElementById('m-nome').textContent = nome;
            document.getElementById('m-id').textContent = `🆔 ${id}`;
            document.getElementById('m-resposta').value = resposta || '';
            document.getElementById('modalResposta').classList.remove('escondido');
        }

        function fecharModal() {
            document.getElementById('modalResposta').classList.add('escondido');
            document.getElementById('m-resposta').value = '';
        }

        async function enviarResposta() {
            if (!db) return;
            const chave = document.getElementById('m-chave').value;
            const texto = document.getElementById('m-resposta').value.trim();
            if (!texto) { alert("Escreva sua resposta!"); return; }
            await db.ref(`${CAMINHO_MSG}/${chave}`).update({
                resposta: texto,
                dataResposta: dataAtual()
            });
            alert("✅ Enviada!");
            fecharModal();
            carregarTudo();
        }

        async function excluirMensagem(chave) {
            if (!confirm("Excluir esta mensagem?")) return;
            if (db) await db.ref(`${CAMINHO_MSG}/${chave}`).remove();
            carregarTudo();
        }

        // ✅ APAGA SOMENTE AS VISUALIZAÇÕES — MANTÉM AS MENSAGENS
        async function excluirSomenteAcessos(idPessoa) {
            if (!confirm(`Apagar SOMENTE os dados de visualização de ${idPessoa}?\nAs mensagens serão MANTIDAS!`)) return;
            if (!db) return;
            await db.ref(`${CAMINHO_ACESSOS}/${idPessoa}`).remove();
            alert("✅ Visualizações apagadas! Mensagens mantidas.");
            carregarTudo();
        }

        // ✅ LIMPA SOMENTE AS MENSAGENS — MANTÉM AS VISUALIZAÇÕES
        async function limparSomenteMensagens() {
            if (!confirm("Apagar SOMENTE todas as mensagens?\nOs dados de visitas serão MANTIDOS!")) return;
            if (!db) return;
            await db.ref(CAMINHO_MSG).remove();
            alert("✅ Mensagens apagadas! Visitas mantidas.");
            carregarTudo();
        }
    </script>
</body>
</html>
