<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area de Gerenciar — Encanto Nail Designer</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            min-height: 100vh;
            background: linear-gradient(180deg, #fff0f8 0%, #ffe6f2 100%);
            background-image: 
                radial-gradient(#ffb3d9 1px, transparent 1px),
                radial-gradient(#ffb3d9 1px, transparent 1px);
            background-size: 25px 25px;
            background-position: 0 0, 12.5px 12.5px;
            font-family: 'Segoe UI', sans-serif;
            padding: 1rem;
        }

        .caixa-principal {
            max-width: 720px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 28px;
            border: 4px solid #ff99cc;
            padding: 2.5rem;
            box-shadow: 0 10px 30px rgba(255, 102, 178, 0.2);
            position: relative;
            overflow: hidden;
        }

        .faixa-topo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 8px;
            background: linear-gradient(90deg, #ff66b2, #ff80c0, #ffb3d9, #ff80c0, #ff66b2);
        }

        h1 {
            text-align: center;
            color: #ff66b2;
            font-size: 2rem;
            font-weight: 900;
            font-family: 'Georgia', serif;
            font-style: italic;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 0 #fff, 3px 3px 0 #ffd9e6;
        }

        .subtitulo-pagina {
            text-align: center;
            color: #b34782;
            font-size: 1rem;
            letter-spacing: 2px;
            margin-bottom: 2rem;
        }

        .coracao { color: #ff66b2; }

        .escondido { display: none !important; }

        input, textarea {
            width: 100%;
            padding: 1rem 1.2rem;
            border: 2px solid #ffd9e6;
            border-radius: 16px;
            font-size: 1rem;
            margin-bottom: 1rem;
            outline: none;
            transition: all 0.3s ease;
            background: #fffafc;
        }

        input:focus, textarea:focus {
            border-color: #ff66b2;
            box-shadow: 0 0 0 4px rgba(255, 102, 178, 0.15);
            background: #fff;
        }

        button {
            padding: 1rem 1.5rem;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(0,0,0,0.1); }
        button:active { transform: translateY(0); }

        .btn-principal {
            background: linear-gradient(90deg, #ff66b2, #ff80c0);
            color: white;
            width: 100%;
            font-size: 1.1rem;
            box-shadow: 0 4px 12px rgba(255, 102, 178, 0.3);
        }

        .btn-sair {
            background: linear-gradient(90deg, #e53935, #f4511e);
            color: white;
            padding: 0.7rem 1.3rem;
            font-size: 0.9rem;
        }

        .btn-verde {
            background: linear-gradient(90deg, #25D366, #128C7E);
            color: white;
        }

        .btn-vermelho {
            background: linear-gradient(90deg, #ef5350, #e53935);
            color: white;
        }

        .btn-roxo {
            background: linear-gradient(90deg, #993366, #b34782);
            color: white;
        }

        .aviso-erro {
            color: #d32f2f;
            background: #ffebee;
            padding: 0.8rem 1rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            border-left: 4px solid #ef5350;
        }

        .botoes {
            display: flex;
            gap: 0.7rem;
            flex-wrap: wrap;
            margin: 1.5rem 0;
        }

        .botoes button { flex: 1; min-width: 120px; }

        .linha-cabecalho {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px dashed #ffd9e6;
        }

        .mensagem-card {
            border-radius: 20px;
            padding: 1.5rem;
            margin-bottom: 1.2rem;
            transition: all 0.3s ease;
            position: relative;
        }

        .mensagem-card:hover { transform: translateY(-2px); }

        .pendente {
            background: linear-gradient(135deg, #fff9e6, #fff3cd);
            border: 2px solid #ffc107;
            box-shadow: 0 4px 12px rgba(255, 193, 7, 0.15);
        }

        .respondida {
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
            border: 2px solid #66bb6a;
            box-shadow: 0 4px 12px rgba(102, 187, 106, 0.15);
        }

        .etiqueta-status {
            display: inline-block;
            padding: 0.3rem 1rem;
            border-radius: 50px;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .status-pendente { background: #fff3cd; color: #856404; }
        .status-respondido { background: #c8e6c9; color: #2e7d32; }

        .resposta-caixa {
            background: #ffffff;
            border-radius: 16px;
            padding: 1.3rem;
            margin-top: 1rem;
            border-left: 4px solid #25D366;
            box-shadow: inset 0 0 10px rgba(37, 211, 102, 0.08);
        }

        .resposta-titulo {
            font-weight: bold;
            color: #2e7d32;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .modal-fundo {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            z-index: 999;
        }

        .modal {
            background: #fff;
            border-radius: 24px;
            padding: 2rem;
            max-width: 440px;
            width: 100%;
            border: 4px solid #ff99cc;
            box-shadow: 0 10px 30px rgba(255, 102, 178, 0.25);
            animation: aparecer 0.3s ease;
        }

        @keyframes aparecer {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal h3 {
            color: #ff66b2;
            font-size: 1.4rem;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .voltar {
            text-align: center;
            margin-top: 2rem;
        }

        .voltar a {
            color: #b34782;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .voltar a:hover {
            color: #ff66b2;
            text-decoration: underline;
        }

        .vazio {
            text-align: center;
            padding: 3rem 1rem;
            color: #b34782;
        }

        .vazio .emoji { font-size: 3rem; margin-bottom: 1rem; }

        .info-remetente {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.8rem;
        }

        .nome-remetente {
            font-weight: bold;
            color: #664455;
            font-size: 1.05rem;
        }

        .data-msg {
            font-size: 0.85rem;
            color: #999;
        }

        .texto-msg {
            color: #444;
            line-height: 1.6;
            margin-bottom: 0.5rem;
        }

        @media (max-width: 480px) {
            .caixa-principal { padding: 1.5rem; border-radius: 24px; }
            h1 { font-size: 1.6rem; }
            .linha-cabecalho { flex-direction: column; gap: 1rem; text-align: center; }
        }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div id="telaLogin" class="caixa-principal">
        <div class="faixa-topo"></div>
        <h1>💎 Area de Gerenciar</h1>
        <p class="subtitulo-pagina">
            <span class="coracao">♥</span> Encanto Nail Designer <span class="coracao">♥</span>
        </p>

        <input type="password" id="campoSenha" placeholder="Digite a senha de acesso...">
        <p id="avisoErro" class="aviso-erro escondido">Senha incorreta! Tente novamente.</p>

        <button class="btn-principal" onclick="verificarSenha()">
            Entrar na Area
        </button>

        <div class="voltar">
            <a href="index.html">Voltar para a pagina principal</a>
        </div>
    </div>

    <!-- PAINEL DE GERENCIAR -->
    <div id="painelGerencia" class="caixa-principal escondido">
        <div class="faixa-topo"></div>
        
        <div class="linha-cabecalho">
            <div>
                <h1>💎 Area de Gerenciar</h1>
                <p class="subtitulo-pagina" style="margin:0; text-align:left;">
                    Bem-vinda, Mylena <span class="coracao">♥</span>
                </p>
            </div>
            <button id="botaoSairArea" class="btn-sair" onclick="sairAreaAdministrativa()">
                Sair
            </button>
        </div>

        <div class="botoes">
            <button id="btnLimparParticipantes" class="btn-vermelho escondido">Limpar Lista 1</button>
            <button id="btnLimparApoiadores" class="btn-vermelho escondido">Limpar Lista 2</button>
        </div>

        <h3 style="margin: 2rem 0 1rem; color:#993366; font-size:1.3rem;">
            Mensagens Recebidas
        </h3>
        
        <div id="painel-mensagens-admin"></div>

        <div class="voltar">
            <a href="index.html">Voltar para o site</a>
        </div>
    </div>

    <!-- MODAL DE RESPONDER -->
    <div id="modalResposta" class="modal-fundo escondido">
        <div class="modal">
            <h3>Responder Mensagem</h3>
            
            <p style="margin-bottom:0.5rem; color:#666;">
                <strong>Para:</strong> <span id="remetenteMensagem"></span>
            </p>
            
            <textarea 
                id="textoResposta" 
                rows="5" 
                placeholder="Escreva sua resposta aqui..."
            ></textarea>
            
            <input type="hidden" id="chaveMensagemAtual">
            
            <div style="display:flex; gap:0.7rem; margin-top:0.5rem;">
                <button class="btn-verde" style="flex:1;" onclick="enviarResposta()">
                    Enviar Resposta
                </button>
                <button class="btn-roxo" style="flex:1;" onclick="fecharModalResposta()">
                    Cancelar
                </button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // DADOS DO SISTEMA
        // ==========================================
        const SENHA_ADMIN = "WJ321";
        const NOME_REMETENTE_ADMIN = "Mylena — Encanto Nail Designer";
        const CAMINHO_BASE = "encanto_nail_designer/mensagens";
        const CHAVE_ACESSO = "adminAcessoLiberado";

        let acessoLiberado = false;

        const firebaseConfig = {
            apiKey: "AIzaSyCqsOq01FhDq9z9Wn0tK9XbP8mIeQ9z7yM",
            authDomain: "willobras.firebaseapp.com",
            databaseURL: "https://willobras-default-rtdb.firebaseio.com",
            projectId: "willobras",
            storageBucket: "willobras.firebasestorage.app",
            messagingSenderId: "66370500400",
            appId: "1:66370500400:web:42d6569ca2c8172ddf3af5"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function dataAtual() {
            return new Date().toLocaleString('pt-BR');
        }

        // ==========================================
        // MANTER ACESSO SALVO
        // ==========================================
        if (localStorage.getItem(CHAVE_ACESSO) === "SIM") {
            acessoLiberado = true;
            document.getElementById('telaLogin').classList.add('escondido');
            document.getElementById('painelGerencia').classList.remove('escondido');
            document.getElementById('btnLimparParticipantes').classList.remove('escondido');
            document.getElementById('btnLimparApoiadores').classList.remove('escondido');
            carregarTodasMensagensAdmin();
        }

        // ==========================================
        // LOGIN E SAIR
        // ==========================================
        function verificarSenha() {
            const senhaDigitada = document.getElementById('campoSenha').value.trim();
            
            if (senhaDigitada === SENHA_ADMIN) {
                acessoLiberado = true;
                localStorage.setItem(CHAVE_ACESSO, "SIM");

                document.getElementById('telaLogin').classList.add('escondido');
                document.getElementById('painelGerencia').classList.remove('escondido');
                document.getElementById('btnLimparParticipantes').classList.remove('escondido');
                document.getElementById('btnLimparApoiadores').classList.remove('escondido');
                
                carregarTodasMensagensAdmin();
                alert("Acesso liberado! Seja bem-vinda Mylena");
            } else {
                document.getElementById('avisoErro').classList.remove('escondido');
                document.getElementById('campoSenha').value = '';
            }
        }

        function sairAreaAdministrativa() {
            if (!confirm("Tem certeza que deseja sair?")) return;
            
            acessoLiberado = false;
            localStorage.removeItem(CHAVE_ACESSO);

            document.getElementById('painelGerencia').classList.add('escondido');
            document.getElementById('telaLogin').classList.remove('escondido');
            document.getElementById('btnLimparParticipantes').classList.add('escondido');
            document.getElementById('btnLimparApoiadores').classList.add('escondido');
            document.getElementById('avisoErro').classList.add('escondido');
            document.getElementById('campoSenha').value = '';

            alert("Voce saiu com sucesso!");
        }

        // ==========================================
        // RESPONDER E EXCLUIR MENSAGENS
        // ==========================================
        function fecharModalResposta() {
            document.getElementById('modalResposta').classList.add('escondido');
            document.getElementById('textoResposta').value = '';
        }

        function abrirModalResponder(chave, dados) {
            document.getElementById('remetenteMensagem').textContent = dados.nomeRemetente || "Visitante";
            document.getElementById('chaveMensagemAtual').value = chave;
            document.getElementById('textoResposta').value = dados.resposta || "";
            document.getElementById('modalResposta').classList.remove('escondido');
        }

        async function enviarResposta() {
            const chave = document.getElementById('chaveMensagemAtual').value;
            const texto = document.getElementById('textoResposta').value.trim();

            if (!texto) { alert("Escreva sua resposta!"); return; }
            if (!chave) { alert("Erro na chave!"); return; }

            try {
                await db.ref(CAMINHO_BASE + "/" + chave).update({
                    resposta: texto,
                    dataResposta: dataAtual()
                });
                alert("Resposta enviada!");
                fecharModalResposta();
            } catch (e) {
                alert("Erro: " + e.message);
            }
        }

        async function excluirMensagem(chave) {
            if (!confirm("Excluir esta mensagem?")) return;
            await db.ref(CAMINHO_BASE + "/" + chave).remove();
            alert("Excluida!");
        }

        // ==========================================
        // CARREGAR LISTA DE MENSAGENS
        // ==========================================
        function carregarTodasMensagensAdmin() {
            const container = document.getElementById('painel-mensagens-admin');
            
            db.ref(CAMINHO_BASE).on("value", (snap) => {
                container.innerHTML = '';
                if (!snap.exists()) {
                    container.innerHTML = '<div class="vazio"><div class="emoji">💬</div><p>Nenhuma mensagem recebida</p></div>';
                    return;
                }

                snap.forEach((item) => {
                    const chave = item.key;
                    const dados = item.val();
                    if (dados.mensagemNovaAdmin) return;

                    const classeStatus = dados.resposta ? 'respondida' : 'pendente';
                    const textoStatus = dados.resposta 
                        ? '<span class="etiqueta-status status-respondido">Respondida</span>' 
                        : '<span class="etiqueta-status status-pendente">Pendente</span>';

                    container.innerHTML += `
                        <div class="mensagem-card ${classeStatus}">
                            <div class="info-remetente">
                                <span class="nome-remetente">${dados.nomeRemetente || "Visitante"}</span>
                                ${textoStatus}
                            </div>
                            <p class="texto-msg">${dados.texto}</p>
                            <span class="data-msg">${dados.data || ""}</span>
                            ${dados.resposta ? `
                                <div class="resposta-caixa">
                                    <p class="resposta-titulo">📩 Sua Resposta:</p>
                                    <p>${dados.resposta}</p>
                                    <span class="data-msg">${dados.dataResposta || ""}</span>
                                </div>
                            ` : ''}
                            ${acessoLiberado ? `
                                <div class="botoes">
                                    <button class="btn-verde" onclick='abrirModalResponder("${chave}", ${JSON.stringify(dados).replace(/'/g, "\\'")})'>
                                        ${dados.resposta ? 'Editar' : 'Responder'}
                                    </button>
                                    <button class="btn-vermelho" onclick="excluirMensagem('${chave}')">
                                        Excluir
                                    </button>
                                </div>
                            ` : ''}
                        </div>
                    `;
                });
            });
        }
    </script>
</body>
</html>
