<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área Administrativa — Encanto Nail Designer</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            min-height: 100vh;
            background: linear-gradient(180deg, #fff0f8 0%, #ffe6f2 100%);
            background-image: 
                radial-gradient(#ffb3d9 1px, transparent 1px),
                radial-gradient(#ffb3d9 1px, transparent 1px);
            background-size: 25px 25px;
            background-position: 0 0, 12.5px 12.5px;
            font-family: 'Segoe UI', sans-serif;
            padding: 1rem;
        }

        .caixa-principal {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 28px;
            border: 4px solid #ff99cc;
            padding: 2.5rem;
            box-shadow: 0 10px 30px rgba(255, 102, 178, 0.2);
            position: relative;
            overflow: hidden;
        }

        .faixa-topo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 8px;
            background: linear-gradient(90deg, #ff66b2, #ff80c0, #ffb3d9, #ff80c0, #ff66b2);
        }

        h1 {
            text-align: center;
            color: #ff66b2;
            font-size: 2rem;
            font-weight: 900;
            font-family: 'Georgia', serif;
            font-style: italic;
            margin-bottom: 0.5rem;
        }

        .subtitulo {
            text-align: center;
            color: #b34782;
            font-size: 1rem;
            letter-spacing: 2px;
            margin-bottom: 2rem;
        }

        .coracao { color: #ff66b2; }
        .escondido { display: none !important; }

        .grupo-senha {
            position: relative;
            margin-bottom: 1rem;
        }

        input, textarea {
            width: 100%;
            padding: 1rem 1.2rem;
            padding-right: 3.5rem;
            border: 2px solid #ffd9e6;
            border-radius: 16px;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
            background: #fffafc;
        }

        input:focus, textarea:focus {
            border-color: #ff66b2;
            box-shadow: 0 0 0 4px rgba(255, 102, 178, 0.15);
            background: #fff;
        }

        .botao-olho {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            padding: 0;
            box-shadow: none;
            color: #b34782;
        }

        button {
            padding: 0.9rem 1.5rem;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(0,0,0,0.1); }

        .btn-principal {
            background: linear-gradient(90deg, #ff66b2, #ff80c0);
            color: white;
            width: 100%;
            font-size: 1.1rem;
            box-shadow: 0 4px 12px rgba(255, 102, 178, 0.3);
        }

        .btn-sair {
            background: linear-gradient(90deg, #e53935, #f4511e);
            color: white;
            padding: 0.7rem 1.3rem;
            font-size: 0.9rem;
        }

        .btn-verde { background: linear-gradient(90deg, #25D366, #128C7E); color: white; }
        .btn-vermelho { background: linear-gradient(90deg, #ef5350, #e53935); color: white; }
        .btn-azul { background: linear-gradient(90deg, #2196F3, #1976D2); color: white; }

        .aviso-erro {
            color: #d32f2f;
            background: #ffebee;
            padding: 0.8rem 1rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            border-left: 4px solid #ef5350;
        }

        .linha-cabecalho {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px dashed #ffd9e6;
        }

        /* BLOCO DA PESSOA — AGRUPA TUDO */
        .bloco-pessoa {
            background: #faf0f5;
            border-radius: 20px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border-left: 5px solid #ff66b2;
        }

        .pessoa-nome {
            font-weight: bold;
            font-size: 1.2rem;
            color: #993366;
            margin-bottom: 0.5rem;
        }

        .pessoa-dados {
            display: flex;
            flex-wrap: wrap;
            gap: 0.7rem;
            margin-bottom: 1rem;
            font-size: 0.85rem;
        }

        .etiqueta {
            display: inline-block;
            padding: 0.3rem 0.8rem;
            border-radius: 50px;
            font-weight: 600;
        }

        .etq-id { background: #e3f2fd; color: #1565c0; }
        .etq-acessos { background: #fff3cd; color: #856404; }
        .etq-data { background: #f3e5f5; color: #7b1fa2; }

        .mensagem-card {
            border-radius: 16px;
            padding: 1.2rem;
            margin-bottom: 0.8rem;
            border: 2px solid #eee;
            background: #fff;
        }

        .pendente { background: linear-gradient(135deg, #fff9e6, #fff3cd); border-color: #ffc107; }
        .respondida { background: linear-gradient(135deg, #e8f5e9, #c8e6c9); border-color: #66bb6a; }

        .etiqueta-status {
            display: inline-block;
            padding: 0.3rem 0.8rem;
            border-radius: 50px;
            font-weight: bold;
            font-size: 0.8rem;
            margin-left: 0.5rem;
        }

        .status-pendente { background: #fff3cd; color: #856404; }
        .status-respondido { background: #c8e6c9; color: #2e7d32; }

        .resposta-caixa {
            background: #fff;
            border-radius: 12px;
            padding: 1rem;
            margin-top: 0.8rem;
            border-left: 4px solid #25D366;
        }

        .botoes-acao {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
            margin-top: 0.8rem;
        }

        .botoes-acao button { flex: 1; min-width: 110px; padding: 0.7rem; font-size: 0.9rem; }

        .modal-fundo {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            display: flex; align-items: center; justify-content: center;
            padding: 1rem;
            z-index: 999;
        }

        .modal {
            background: #fff; border-radius: 24px; padding: 2rem;
            max-width: 440px; width: 100%;
            border: 4px solid #ff99cc;
            box-shadow: 0 10px 30px rgba(255, 102, 178, 0.25);
        }

        .modal h3 {
            color: #ff66b2;
            font-size: 1.4rem;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .vazio {
            text-align: center;
            padding: 3rem 1rem;
            color: #b34782;
        }

        .vazio .emoji { font-size: 3rem; margin-bottom: 1rem; }

        .voltar {
            text-align: center;
            margin-top: 2rem;
        }

        .voltar a {
            color: #b34782;
            text-decoration: none;
            font-weight: 500;
        }

        .voltar a:hover { color: #ff66b2; text-decoration: underline; }

        @media (max-width: 600px) {
            .caixa-principal { padding: 1.5rem; border-radius: 24px; }
            .linha-cabecalho { flex-direction: column; gap: 1rem; text-align: center; }
            .pessoa-dados { justify-content: center; }
        }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div id="telaLogin" class="caixa-principal">
        <div class="faixa-topo"></div>
        <h1>🔐 Área Administrativa</h1>
        <p class="subtitulo">
            <span class="coracao">♥</span> Encanto Nail Designer <span class="coracao">♥</span>
        </p>

        <div class="grupo-senha">
            <input 
                type="password" 
                id="campoSenha" 
                placeholder="Digite a senha de acesso..."
                autocomplete="off"
            >
            <button type="button" class="botao-olho" id="botaoOlho" onclick="alternarVisibilidade()">🙈</button>
        </div>

        <p id="avisoErro" class="aviso-erro escondido">
            ❌ Senha incorreta! Acesso negado.
        </p>

        <button class="btn-principal" onclick="verificarSenha()">
            🔐 Entrar
        </button>

        <div class="voltar">
            <a href="index.html">← Voltar para o site</a>
        </div>
    </div>

    <!-- PAINEL DE CONTROLE -->
    <div id="painelControle" class="caixa-principal escondido">
        <div class="faixa-topo"></div>
        
        <div class="linha-cabecalho">
            <div>
                <h1>📊 Painel de Controle</h1>
                <p class="subtitulo" style="margin:0; text-align:left;">
                    Bem-vinda, Mylena <span class="coracao">♥</span>
                </p>
            </div>
            <button class="btn-sair" onclick="sair()">🚪 Sair</button>
        </div>

        <p style="color:#993366; font-size:0.9rem; margin-bottom:1.5rem;">
            🆔 ID = identificador único | 👁️ = quantas vezes entrou | 📅 = datas de acesso
        </p>

        <div id="lista-conteudo"></div>

        <div class="botoes-acao" style="margin-top:2rem;">
            <button class="btn-vermelho" onclick="if(confirm('⚠️ APAGAR TUDO? Não tem volta!')) limparTudo()">
                🗑️ Limpar Tudo
            </button>
        </div>

        <div class="voltar">
            <a href="index.html">← Voltar para o site</a>
        </div>
    </div>

    <!-- MODAL DE RESPONDER -->
    <div id="modalResposta" class="modal-fundo escondido">
        <div class="modal">
            <h3>✍️ Responder Mensagem</h3>
            <p style="margin-bottom:0.5rem; color:#666;">
                <strong>De:</strong> <span id="m-nome"></span>
                <span class="etiqueta etq-id" id="m-id">—</span>
            </p>
            <textarea id="m-resposta" rows="5" placeholder="Escreva sua resposta..."></textarea>
            <input type="hidden" id="m-chave">
            <div style="display:flex; gap:0.7rem; margin-top:1rem;">
                <button class="btn-verde" style="flex:1;" onclick="enviarResposta()">✅ Enviar</button>
                <button class="btn-vermelho" style="flex:1;" onclick="fecharModal()">✖️ Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // CONFIGURAÇÕES
        // ==========================================
        const SENHA_ADMIN = "WJ321";
        const CAMINHO_MSG = "encanto_nail_designer/mensagens";
        const CAMINHO_ACESSOS = "encanto_nail_designer/acessos";

        // FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyCqsOq01FhDq9z9Wn0tK9XbP8mIeQ9z7yM",
            authDomain: "willobras.firebaseapp.com",
            databaseURL: "https://willobras-default-rtdb.firebaseio.com",
            projectId: "willobras",
            storageBucket: "willobras.firebasestorage.app",
            messagingSenderId: "66370500400",
            appId: "1:66370500400:web:42d6569ca2c8172ddf3af5"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function dataAtual() {
            return new Date().toLocaleString('pt-BR');
        }

        // ==========================================
        // LOGIN
        // ==========================================
        let senhaVisivel = false;
        function alternarVisibilidade() {
            const campo = document.getElementById('campoSenha');
            const botao = document.getElementById('botaoOlho');
            senhaVisivel = !senhaVisivel;
            campo.type = senhaVisivel ? 'text' : 'password';
            botao.textContent = senhaVisivel ? '👁️' : '🙈';
        }

        function verificarSenha() {
            if (document.getElementById('campoSenha').value.trim() === SENHA_ADMIN) {
                document.getElementById('telaLogin').classList.add('escondido');
                document.getElementById('painelControle').classList.remove('escondido');
                carregarTudo();
            } else {
                document.getElementById('avisoErro').classList.remove('escondido');
                document.getElementById('campoSenha').value = '';
            }
        }

        function sair() {
            if (!confirm("Sair da área administrativa?")) return;
            document.getElementById('painelControle').classList.add('escondido');
            document.getElementById('telaLogin').classList.remove('escondido');
            document.getElementById('avisoErro').classList.add('escondido');
            document.getElementById('campoSenha').value = '';
            senhaVisivel = false;
            document.getElementById('botaoOlho').textContent = '🙈';
            document.getElementById('campoSenha').type = 'password';
        }

        // ==========================================
        // CARREGAR TUDO — ACESSOS + MENSAGENS
        // ==========================================
        async function carregarTudo() {
            const snapAcessos = await db.ref(CAMINHO_ACESSOS).once("value");
            const snapMensagens = await db.ref(CAMINHO_MSG).once("value");

            const acessos = snapAcessos.val() || {};
            const mensagens = snapMensagens.val() || {};
            const container = document.getElementById('lista-conteudo');
            container.innerHTML = '';

            if (!snapAcessos.exists() && !snapMensagens) {
                container.innerHTML = '<div class="vazio"><div class="emoji">📭</div><p>Nenhuma pessoa visitou ainda</p></div>';
                return;
            }

            // Agrupar mensagens por ID da pessoa
            const porId = {};
            for (const chave in mensagens) {
                const m = mensagens[chave];
                if (!m.idRemetente) continue;
                if (!porId[m.idRemetente]) porId[m.idRemetente] = [];
                porId[m.idRemetente].push({ chave, ...m });
            }

            // Exibir pessoas que têm registro de acesso
            for (const idPessoa in acessos) {
                const p = acessos[idPessoa];
                const nomeExibir = p.nome || "Visitante (sem nome)";
                const msgs = porId[idPessoa] || [];

                container.innerHTML += `
                    <div class="bloco-pessoa">
                        <div class="pessoa-nome">${nomeExibir}</div>
                        <div class="pessoa-dados">
                            <span class="etiqueta etq-id">🆔 ${p.id}</span>
                            <span class="etiqueta etq-acessos">👁️ ${p.acessos || 0} acessos</span>
                            <span class="etiqueta etq-data">📅 1º: ${p.primeiroAcesso || '—'}</span>
                            <span class="etiqueta etq-data">🕘 Último: ${p.ultimoAcesso || '—'}</span>
                        </div>
                        ${msgs.length === 0 ? '<p style="color:#999; font-size:0.9rem;">Sem mensagens ainda</p>' : ''}
                        ${msgs.map(m => `
                            <div class="mensagem-card ${m.resposta ? 'respondida' : 'pendente'}">
                                <p style="margin-bottom:0.5rem;">${m.texto}</p>
                                <span style="font-size:0.8rem; color:#888;">${m.data}</span>
                                <span class="etiqueta-status ${m.resposta ? 'status-respondido' : 'status-pendente'}">
                                    ${m.resposta ? '✅ Respondida' : '⏳ Pendente'}
                                </span>
                                ${m.resposta ? `
                                    <div class="resposta-caixa">
                                        <p style="font-weight:bold; color:#2e7d32; margin-bottom:0.3rem;">📩 Sua resposta:</p>
                                        <p>${m.resposta}</p>
                                        <span style="font-size:0.8rem; color:#888;">${m.dataResposta || ''}</span>
                                    </div>
                                ` : ''}
                                <div class="botoes-acao">
                                    <button class="btn-verde" onclick='abrirModal("${m.chave}", "${nomeExibir}", "${idPessoa}", `${m.resposta || ''}`)'>
                                        ${m.resposta ? '✏️ Editar' : '✍️ Responder'}
                                    </button>
                                    <button class="btn-vermelho" onclick="excluirMensagem('${m.chave}')">🗑️ Mensagem</button>
                                </div>
                            </div>
                        `).join('')}
                        <div class="botoes-acao">
                            <button class="btn-azul" onclick="excluirPessoa('${idPessoa}')">🗑️ Apagar esta pessoa</button>
                        </div>
                    </div>
                `;
            }

            // Pessoas com mensagens mas sem registro de acesso
            for (const id in porId) {
                if (acessos[id]) continue;
                const msgs = porId[id];
                container.innerHTML += `
                    <div class="bloco-pessoa" style="opacity:0.8;">
                        <div class="pessoa-nome">${msgs[0].nomeRemetente || "Visitante (sem nome)"}</div>
                        <div class="pessoa-dados">
                            <span class="etiqueta etq-id">🆔 ${id}</span>
                            <span class="etiqueta etq-acessos">👁️ Sem registro de acesso</span>
                        </div>
                        ${msgs.map(m => `
                            <div class="mensagem-card ${m.resposta ? 'respondida' : 'pendente'}">
                                <p>${m.texto}</p>
                                <span style="font-size:0.8rem; color:#888;">${m.data}</span>
                                <div class="botoes-acao">
                                    <button class="btn-verde" onclick='abrirModal("${m.chave}", "${m.nomeRemetente||'Visitante'}", "${id}", `${m.resposta||''}`)'>Responder</button>
                                    <button class="btn-vermelho" onclick="excluirMensagem('${m.chave}')">🗑️ Mensagem</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }
        }

        // ==========================================
        // FUNÇÕES DE AÇÃO
        // ==========================================
        function abrirModal(chave, nome, id, resposta) {
            document.getElementById('m-chave').value = chave;
            document.getElementById('m-nome').textContent = nome;
            document.getElementById('m-id').textContent = `🆔 ${id}`;
            document.getElementById('m-resposta').value = resposta || '';
            document.getElementById('modalResposta').classList.remove('escondido');
        }

        function fecharModal() {
            document.getElementById('modalResposta').classList.add('escondido');
            document.getElementById('m-resposta').value = '';
        }

        async function enviarResposta() {
            const chave = document.getElementById('m-chave').value;
            const texto = document.getElementById('m-resposta').value.trim();
            if (!texto) { alert("Escreva sua resposta!"); return; }
            await db.ref(`${CAMINHO_MSG}/${chave}`).update({
                resposta: texto,
                dataResposta: dataAtual()
            });
            alert("✅ Resposta enviada!");
            fecharModal();
            carregarTudo();
        }

        async function excluirMensagem(chave) {
            if (!confirm("Excluir esta mensagem?")) return;
            await db.ref(`${CAMINHO_MSG}/${chave}`).remove();
            carregarTudo();
        }

        async function excluirPessoa(idPessoa) {
            if (!confirm(`Apagar TODOS os dados de ${idPessoa}?\nAcessos + mensagens serão removidos!`)) return;
            // Apaga registro de acessos
            await db.ref(`${CAMINHO_ACESSOS}/${idPessoa}`).remove();
            // Apaga todas as mensagens desta pessoa
            const snap = await db.ref(CAMINHO_MSG).orderByChild("idRemetente").equalTo(idPessoa).once("value");
            const updates = {};
            snap.forEach(item => { updates[item.key] = null; });
            await db.ref(CAMINHO_MSG).update(updates);
            alert("✅ Dados apagados com sucesso!");
            carregarTudo();
        }

        async function limparTudo() {
            if (!confirm("⚠️ APAGAR TUDO — acessos + mensagens de TODAS as pessoas?\nNão tem volta!")) return;
            await db.ref(CAMINHO_MSG).remove();
            await db.ref(CAMINHO_ACESSOS).remove();
            alert("✅ Tudo foi apagado!");
            carregarTudo();
        }
    </script>
</body>
</html>
